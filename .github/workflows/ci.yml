name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: lint + tests (source-tracing backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r services/source-tracing/requirements-dev.txt

      - name: Lint (ruff — real errors only)
        # services/agent is included deliberately: it was outside this list, and agent.py sat
        # on main with a SyntaxError (escaped triple quotes) that nothing ever ran into.
        run: ruff check services pipeline

      - name: Tests (pytest)
        run: pytest -q services/source-tracing/tests pipeline/tests services/replay/tests

      - name: Model-quality gate (committed backtest vs baseline)
        run: |
          python services/source-tracing/eval/metrics_gate.py \
            --report services/source-tracing/data/validation_report.json \
            --baseline services/source-tracing/eval/baseline_metrics.json
